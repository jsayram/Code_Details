# Pull-request checks (Phase B, B11/B12). Trigger safety was checked read-only
# on 2026-10-28: the repository has no Actions secrets or variables, no
# webhooks, no deployment environments other than Copilot's, and a read-only
# default token. This workflow uses no secrets, deploys nothing, never runs on
# pull_request_target, and gives the token read access only.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit and component tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.3.0
          cache: npm
      # --ignore-scripts: no install script runs, and Playwright downloads no browser.
      - run: npm ci --ignore-scripts
      # No .env file exists in CI and the test DB isn't provisioned, so the
      # integration suites skip themselves; unit and component tests run fully offline.
      - run: npm test

  typecheck:
    name: Type check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.3.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  lint:
    name: Lint (tests and test config)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.3.0
          cache: npm
      - run: npm ci --ignore-scripts
      # Scoped: the whole repo still has 51 pre-existing ESLint errors (Phase A).
      # Widen this as those are fixed by their owning phases.
      - run: npm run lint:tests

  build:
    name: Isolated build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.3.0
          cache: npm
      - run: npm ci --ignore-scripts
      # Synthetic env with no database URL (E03), socket guard
      # preloaded; output in .next-test. No artifact is uploaded.
      - run: npm run build:isolated
